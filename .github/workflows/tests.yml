name: Robotdashboard Tests

on:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Python unit tests
        run: |
          bash scripts/python-tests.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: results/coverage.xml

  javascript-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: |
          bash scripts/javascript-tests.sh

  robot-tests:
    runs-on: ubuntu-latest
    # Prebuilt image with pip, requirements-test.txt and rfbrowser init already done
    # (built by test-image.yml from scripts/docker/test-dashboard-robot.dockerfile, same image
    # as the local Docker test runs). Saves ~1.5 minutes of setup per run.
    container:
      image: ghcr.io/marketsquare/robotframework-dashboard-test-robot:latest
      # the token can pull the package as long as it is linked to this repository (or public)
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install/Build project
        run: |
          bash scripts/install.sh

      - name: Run Robot Framework tests
        run: |
          bash scripts/robot-tests.sh

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
