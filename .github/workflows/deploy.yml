# Build the versioned VitePress docs site and deploy it to GitHub Pages.
#
# Layout (see scripts/docs/build-versioned-docs.mjs):
#   /        latest release tag      /dev/  main (unreleased)
#   /vX.Y.Z/ every release tag       /versions.json
name: Deploy RobotDashboard docs site to Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every release tag is checked out into a worktree
      - name: Fetch main
        # on a tag push main is not checked out; the /dev/ build reads it from origin/main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      # Released versions never change: their finished builds are kept between
      # runs and only rebuilt when the shared docs config/theme or scripts change.
      # A new run always restores the most recent cache (restore-keys prefix)
      # and saves a new one only when the build script rebuilt something.
      - name: Restore built docs versions
        uses: actions/cache/restore@v4
        with:
          path: .docs-dist-cache
          key: docs-dist-cache-${{ github.run_id }}
          restore-keys: docs-dist-cache-
      - name: Build every docs version with VitePress
        run: npm run docs:build:versions -- --main-ref origin/main
        env:
          DOCS_CACHE_DIR: .docs-dist-cache
      - name: Save built docs versions
        if: hashFiles('.docs-dist-cache/.updated') != ''
        uses: actions/cache/save@v4
        with:
          path: .docs-dist-cache
          key: docs-dist-cache-${{ github.run_id }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
