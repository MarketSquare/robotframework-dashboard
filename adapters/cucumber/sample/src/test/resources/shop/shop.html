<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sample shop</title></head>
<body>
<h1>Sample shop</h1>
<input id="search" placeholder="Search products">
<ul id="results"></ul>
<button id="add">Add to cart</button>
<span id="cart">0</span>
<script>
  const products = ['Robot', 'Playwright', 'Dashboard', 'Keyboard'];
  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.getElementById('results').innerHTML = products
      .filter((p) => q && p.toLowerCase().includes(q))
      .map((p) => `<li>${p}</li>`)
      .join('');
  });
  document.getElementById('add').addEventListener('click', () => {
    const cart = document.getElementById('cart');
    cart.textContent = String(Number(cart.textContent) + 1);
  });
</script>
</body>
</html>
