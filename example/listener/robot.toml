# RobotCode Configuration for RobotDashboard Listener
#
# The listener ships inside the robotframework-dashboard package (no extra dependencies), so it
# can be referenced by its dotted module path below with nothing to place in your project.
# If you'd rather use a local file copy instead, see the commented "file path" variants below.
#
# Setup:
#   1. Place robot.toml in project root
#   2. pip install robotcode-runner
#   3. robotdashboard --server (start the dashboard server)
#   4. Choose one listener configuration below (uncomment to use)
#   5. robotcode robot .
#
# Reference: https://robotcode.io/02_get_started/configuration
# Run examples:
#   robotcode robot path/to/tests/
#   robotcode -p dev robot -d results ./tests/

# Basic - no parameters
[listeners]
"robotframework_dashboard.robotdashboardlistener" = []

# With tags and version
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["tags=dev1,dev2,dev3", "version=v1.2.3"]

# With log upload
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["uploadlog=true"]

# Custom host/port with limit
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["host=127.0.0.2", "port=8888", "limit=100"]

# No port (server on the protocol's default port, or behind a reverse proxy)
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["host=dashboard.internal.company.com", "port="]

# HTTPS with SSL verification disabled (for self-signed certificates)
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["protocol=https", "port=8543", "sslverify=false"]

# HTTPS with a custom CA bundle
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["protocol=https", "port=8543", "sslverify=/path/to/ca-bundle.pem"]

# All features combined
# [listeners]
# "robotframework_dashboard.robotdashboardlistener" = ["tags=dev1,dev2", "version=v2.0", "uploadlog=true", "limit=100", "host=127.0.0.2", "port=8888"]

# --- Using a local file copy instead of the dotted module path ---
# Place robotdashboardlistener.py (from example/listener/) next to this file, then reference it
# the same way, swapping "robotframework_dashboard.robotdashboardlistener" for
# "robotdashboardlistener.py" in any of the examples above, e.g.:
# [listeners]
# "robotdashboardlistener.py" = []
